<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Strategy Attack 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #0A0A00; width: 100%; height: 100%; }
</style>
</head>
<body>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Game modules (order matters: gameState first, then systems, then orchestrator) -->
<script src="gameState.js"></script>
<script src="renderer.js"></script>
<script src="buildings.js"></script>
<script src="weapons.js"></script>
<script src="robots.js"></script>
<script src="ai.js"></script>
<script src="ui.js"></script>
<script src="sfx.js"></script>

<!-- ════════════════════════════════════════════════════════ -->
<!-- ORCHESTRATOR — Game Loop, Combat Resolution, Integration -->
<!-- ════════════════════════════════════════════════════════ -->
<script>
(function() {
  'use strict';

  let state = null;
  let buildingMeshes = {};     // segmentIndex -> THREE.Group (building mesh)
  let missileMeshes = [];      // active missile animation meshes
  let robotMeshes = [];        // active robot animation meshes
  let effectGroups = [];       // temporary effect groups (explosions, etc)
  let combatAnimQueue = [];    // queued animation events from combat resolution
  let combatAnimating = false;
  let combatTimer = 0;
  let pendingPlayerMissiles = [];  // missiles queued this turn
  let pendingPlayerRobots = [];    // robots queued this turn
  let raycaster, mouse;

  // ════════════════════════════════════════
  // INITIALIZATION
  // ════════════════════════════════════════
  function initGame(aiMode) {
    // Clean up previous game
    cleanupGame();

    state = createInitialGameState(aiMode);

    // Initialize renderer
    if (!Renderer.getScene()) {
      Renderer.init();
    }

    // Initialize SFX
    SFX.init(Renderer.getScene());

    // Setup raycaster for segment clicking
    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    // Place initial command center meshes
    placeBuilding(CONST.COMMAND_CENTER_SEGMENT_PLAYER, CONST.BUILDING.COMMAND_CENTER, CONST.SIDE_PLAYER);
    placeBuilding(CONST.COMMAND_CENTER_SEGMENT_AI, CONST.BUILDING.COMMAND_CENTER, CONST.SIDE_AI);

    // Transition to planning phase
    startPlanningPhase();

    // Start game update loop
    requestAnimationFrame(gameLoop);

    SFX.play('turnStart');
    UI.addLogEntry('=== ROBOT ATTACK 2026 ===', 'system');
    UI.addLogEntry('Mode: ' + AI.getModeDescription(aiMode), 'system');
    UI.addLogEntry('Turn 1 — Plan your defenses!', 'system');
  }

  function cleanupGame() {
    // Remove old building meshes
    for (const idx in buildingMeshes) {
      if (buildingMeshes[idx]) {
        Renderer.removeMeshFromScene(buildingMeshes[idx]);
      }
    }
    buildingMeshes = {};
    missileMeshes = [];
    robotMeshes = [];
    effectGroups = [];
    combatAnimQueue = [];
    combatAnimating = false;
    pendingPlayerMissiles = [];
    pendingPlayerRobots = [];
  }

  // ════════════════════════════════════════
  // BUILDING PLACEMENT
  // ════════════════════════════════════════
  function placeBuilding(segmentIndex, type, side) {
    const pos = Renderer.segmentToWorldPos(segmentIndex);
    const mesh = Buildings.createBuildingMesh(type, side);
    // Buildings were designed for 50-unit segments; scale to fit 12-unit cells
    const BUILDING_SCALE = 0.22;
    mesh.scale.set(BUILDING_SCALE, BUILDING_SCALE, BUILDING_SCALE);
    mesh.position.set(pos.x, pos.y + 1, pos.z);
    Renderer.addMeshToScene(mesh);
    buildingMeshes[segmentIndex] = mesh;

    // Create building in state if not already there
    if (!state.segments[segmentIndex].building) {
      state.segments[segmentIndex].building = createBuilding(type, side, segmentIndex);
    }
  }

  function removeBuilding(segmentIndex) {
    if (buildingMeshes[segmentIndex]) {
      Renderer.removeMeshFromScene(buildingMeshes[segmentIndex]);
      delete buildingMeshes[segmentIndex];
    }
  }

  // ════════════════════════════════════════
  // PHASE MANAGEMENT
  // ════════════════════════════════════════
  function startPlanningPhase() {
    state.phase = CONST.PHASE_PLANNING;

    // Recalculate income
    state.playerIncome = calculateIncome(state, CONST.SIDE_PLAYER);
    state.aiIncome = calculateIncome(state, CONST.SIDE_AI);
    state.playerEnergy = state.playerIncome;
    state.aiEnergy = state.aiIncome;

    // Reset per-turn states
    Weapons.resetAntiMissileBatteries(state);
    Weapons.resetShieldGenerators(state);
    Robots.resetHangars(state);
    state.combatLog = [];
    state.activeRobots = [];
    pendingPlayerMissiles = [];
    pendingPlayerRobots = [];

    // Process radar for player
    AI.processRadar(state, CONST.SIDE_PLAYER);

    // Update fog of war visuals (all AI cells)
    for (let i = 0; i < state.segments.length; i++) {
      if (state.segments[i].side !== CONST.SIDE_AI) continue;
      const revealed = state.revealedEnemySegments.indexOf(i) !== -1;
      Renderer.setFogRevealed(i, revealed);
    }

    // Update building damage visuals
    updateAllBuildingVisuals();

    UI.showPlanningPhase(state);
  }

  function startAIPlanningPhase() {
    state.phase = CONST.PHASE_AI_PLANNING;
    UI.updateHUD(state);
    UI.addLogEntry('Enemy is planning...', 'system');

    // AI plans with a brief delay for dramatic effect
    setTimeout(function() {
      const aiActions = AI.planTurn(state);

      // Execute AI build actions immediately
      for (const action of aiActions) {
        if (action.type === CONST.ACTION.BUILD) {
          const cost = getCostForBuild(action.buildingType);
          if (state.aiEnergy >= cost) {
            state.aiEnergy -= cost;
            state.segments[action.segmentIndex].building = createBuilding(
              action.buildingType, CONST.SIDE_AI, action.segmentIndex
            );
            // Place mesh (hidden by fog unless revealed)
            placeBuilding(action.segmentIndex, action.buildingType, CONST.SIDE_AI);
          }
        }
      }

      // Collect combat actions
      state.aiActions = aiActions.filter(a =>
        a.type === CONST.ACTION.FIRE_MISSILE || a.type === CONST.ACTION.DEPLOY_ROBOT
      );

      // Start combat phase
      startCombatPhase();
    }, 800);
  }

  function getCostForBuild(type) {
    const keyMap = {
      [CONST.BUILDING.POWER_PLANT]: 'POWER_PLANT',
      [CONST.BUILDING.RADAR_STATION]: 'RADAR_STATION',
      [CONST.BUILDING.MISSILE_SILO]: 'MISSILE_SILO',
      [CONST.BUILDING.ANTI_MISSILE]: 'ANTI_MISSILE',
      [CONST.BUILDING.ROBOT_HANGAR]: 'ROBOT_HANGAR',
      [CONST.BUILDING.SHIELD_GENERATOR]: 'SHIELD_GENERATOR',
      [CONST.BUILDING.COMMAND_CENTER]: 'COMMAND_CENTER'
    };
    return CONST.COST[keyMap[type]] || 0;
  }

  // ════════════════════════════════════════
  // COMBAT PHASE
  // ════════════════════════════════════════
  function startCombatPhase() {
    state.phase = CONST.PHASE_COMBAT;
    UI.showCombatPhase(state);
    UI.addLogEntry('--- COMBAT PHASE ---', 'system');
    combatAnimQueue = [];
    combatAnimating = true;
    combatTimer = 0;

    // Combine all actions
    const allMissileActions = [
      ...pendingPlayerMissiles,
      ...state.aiActions.filter(a => a.type === CONST.ACTION.FIRE_MISSILE)
    ];

    const allRobotActions = [
      ...pendingPlayerRobots,
      ...state.aiActions.filter(a => a.type === CONST.ACTION.DEPLOY_ROBOT)
    ];

    // Resolve missiles
    Weapons.resolveMissiles(state, allMissileActions, function(animEvent) {
      combatAnimQueue.push(animEvent);
    });

    // Resolve robots
    Robots.resolveRobotDeployments(state, allRobotActions, function(animEvent) {
      combatAnimQueue.push(animEvent);
    });

    // Process combat animation queue
    processCombatAnimations();
  }

  function processCombatAnimations() {
    let delay = 0;
    const STEP_DELAY = 600;

    for (let i = 0; i < combatAnimQueue.length; i++) {
      const event = combatAnimQueue[i];
      (function(evt, d) {
        setTimeout(function() { executeCombatAnimation(evt); }, d);
      })(event, delay);
      delay += STEP_DELAY;
    }

    // End combat after all animations
    const totalDuration = Math.max(delay + 1500, 3000);
    setTimeout(function() {
      endCombatPhase();
    }, Math.min(totalDuration, CONST.COMBAT_DURATION_MS));
  }

  function executeCombatAnimation(event) {
    switch (event.type) {
      case 'missile_flight': {
        const trajectory = event.trajectory;
        if (trajectory && trajectory.length > 0) {
          animateMissileFlight(trajectory, event.fromSegment, event.targetSegment);
        }
        const isPlayerMissile = state.segments[event.fromSegment] && state.segments[event.fromSegment].side === CONST.SIDE_PLAYER;
        UI.addLogEntry('Missile fired at segment ' + event.targetSegment,
          isPlayerMissile ? 'player' : 'enemy');
        SFX.play('missileLaunch');

        // Player missiles reveal the target area through fog of war
        if (isPlayerMissile) {
          revealAreaThroughFog(event.targetSegment);
          // Pan camera to show the action
          const tPos = Renderer.segmentToWorldPos(event.targetSegment);
          Renderer.setCameraTarget(tPos.x, tPos.z);
        }

        // Launch smoke at the origin
        const originPos = Renderer.segmentToWorldPos(event.fromSegment);
        SFX.spawnSmoke(originPos.x, originPos.y + 4, originPos.z, 10);
        SFX.spawnSparks(originPos.x, originPos.y + 2, originPos.z, 8);
        break;
      }
      case 'intercept': {
        const m = event.missile;
        UI.addLogEntry('Missile intercepted! (target: ' + m.targetSegment + ')', 'system');
        SFX.play('intercept');
        // Spawn small explosion at midpoint
        const fromPos = Renderer.segmentToWorldPos(m.fromSegment);
        const toPos = Renderer.segmentToWorldPos(m.targetSegment);
        SFX.spawnExplosion((fromPos.x + toPos.x) / 2, 80, (fromPos.z + toPos.z) / 2, 10, 0xFFB000);
        break;
      }
      case 'shield_absorb': {
        const pos = Renderer.segmentToWorldPos(event.segment);
        SFX.spawnShieldHit(pos.x, pos.y + 10, pos.z);
        SFX.play('shieldAbsorb');
        UI.addLogEntry('Shield absorbed hit at segment ' + event.segment, 'system');
        break;
      }
      case 'explosion': {
        const pos = Renderer.segmentToWorldPos(event.segment);
        // Big impact: multiple particle bursts
        SFX.spawnExplosion(pos.x, pos.y + 4, pos.z, 40);
        SFX.spawnExplosion(pos.x, pos.y + 2, pos.z, 20, 0xFFB000);
        SFX.spawnSmoke(pos.x, pos.y + 3, pos.z, 15);
        SFX.spawnSparks(pos.x, pos.y + 3, pos.z, 20);
        // Flash ring
        const ringGeo = new THREE.RingGeometry(1, 3, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xFFFF88, transparent: true, opacity: 1, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(pos.x, pos.y + 2, pos.z);
        Renderer.addMeshToScene(ring);
        let ringStep = 0;
        const ringInt = setInterval(function() {
          ringStep++;
          ring.scale.multiplyScalar(1.3);
          ring.material.opacity *= 0.85;
          if (ringStep > 15) {
            clearInterval(ringInt);
            Renderer.removeMeshFromScene(ring);
            ring.geometry.dispose();
            ring.material.dispose();
          }
        }, 40);
        SFX.triggerShake(12, 0.5);
        SFX.play('explosion');
        Renderer.shakeScreen(10, 0.4);
        UI.addLogEntry('EXPLOSION at segment ' + event.segment + ' (-' + event.damage + ' HP)', 'damage');

        // Update building visual or remove if destroyed
        updateBuildingVisual(event.segment);
        if (state.segments[event.segment].destroyed) {
          removeBuilding(event.segment);
          Renderer.createCrater(event.segment);
        }
        break;
      }
      case 'aoe_damage': {
        const pos = Renderer.segmentToWorldPos(event.segment);
        SFX.spawnSparks(pos.x, pos.y + 5, pos.z);
        UI.addLogEntry('Splash damage at segment ' + event.segment + ' (-' + event.damage + ' HP)', 'damage');
        updateBuildingVisual(event.segment);
        if (state.segments[event.segment].destroyed) {
          removeBuilding(event.segment);
          Renderer.createCrater(event.segment);
        }
        break;
      }
      case 'robot_launch': {
        const traj = event.trajectory;
        if (traj && traj.length > 0) {
          animateRobotDelivery(event.action, traj);
        }
        UI.addLogEntry('Robot deployed toward segment ' + event.action.targetSegment,
          event.action.side === CONST.SIDE_PLAYER ? 'player' : 'enemy');
        SFX.play('missileLaunch');
        break;
      }
      case 'robot_intercepted': {
        UI.addLogEntry('Robot intercepted mid-flight!', 'system');
        SFX.play('intercept');
        break;
      }
      case 'robot_attack': {
        UI.addLogEntry('Robot attacking segment ' + event.targetSegment, 'damage');
        SFX.play('robotAttack');
        break;
      }
      case 'robot_melee_hit': {
        const pos = Renderer.segmentToWorldPos(event.targetSegment);
        SFX.spawnExplosion(pos.x, pos.y + 5, pos.z, 15, 0xFFB000);
        Renderer.shakeScreen(4, 0.2);
        UI.addLogEntry('Robot SMASH at segment ' + event.targetSegment + ' (-' + event.damage + ' HP)', 'damage');
        updateBuildingVisual(event.targetSegment);
        if (state.segments[event.targetSegment].destroyed) {
          removeBuilding(event.targetSegment);
          Renderer.createCrater(event.targetSegment);
        }
        break;
      }
      case 'robot_death': {
        if (event.position) {
          SFX.spawnSmoke(event.position.x, event.position.y + 5, 0, 6);
        }
        break;
      }
    }
  }

  // ── Reveal fog of war around a target cell (3x3 area) ──
  function revealAreaThroughFog(segmentIndex) {
    const revealed = new Set(state.revealedEnemySegments || []);
    const toReveal = [segmentIndex].concat(getAdjacentCells(segmentIndex));
    for (const idx of toReveal) {
      const seg = state.segments[idx];
      if (!seg || seg.side !== CONST.SIDE_AI) continue;
      revealed.add(idx);
      Renderer.setFogRevealed(idx, true);
    }
    state.revealedEnemySegments = Array.from(revealed);
  }

  function animateMissileFlight(trajectory, fromSeg, targetSeg) {
    // Rebuild trajectory using real world positions (2D grid)
    const fromPos = Renderer.segmentToWorldPos(fromSeg);
    const toPos = Renderer.segmentToWorldPos(targetSeg);
    trajectory = Weapons.createMissileTrajectory(fromPos, toPos, 80);

    // ── Missile body: larger, tapered ──
    const missileGroup = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(0.6, 1.2, 5, 8);
    const bodyMat = new THREE.MeshBasicMaterial({ color: 0xFFCC66 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    missileGroup.add(body);

    // Tip (nose cone)
    const tipGeo = new THREE.CylinderGeometry(0.05, 0.6, 1.2, 6);
    const tipMat = new THREE.MeshBasicMaterial({ color: 0xFF3300 });
    const tip = new THREE.Mesh(tipGeo, tipMat);
    tip.position.y = 3;
    missileGroup.add(tip);

    // Fins
    const finGeo = new THREE.BoxGeometry(2.4, 1.2, 0.15);
    const finMat = new THREE.MeshBasicMaterial({ color: 0xFF6600 });
    const fin1 = new THREE.Mesh(finGeo, finMat);
    fin1.position.y = -2.2;
    missileGroup.add(fin1);
    const fin2 = new THREE.Mesh(finGeo, finMat);
    fin2.position.y = -2.2;
    fin2.rotation.y = Math.PI / 2;
    missileGroup.add(fin2);

    // Glowing engine exhaust at back
    const exhaustGeo = new THREE.SphereGeometry(0.9, 6, 6);
    const exhaustMat = new THREE.MeshBasicMaterial({ color: 0xFFFF88, transparent: true, opacity: 0.9 });
    const exhaust = new THREE.Mesh(exhaustGeo, exhaustMat);
    exhaust.position.y = -3;
    missileGroup.add(exhaust);

    Renderer.addMeshToScene(missileGroup);

    // ── Persistent smoke trail — array of fading meshes ──
    const trailPoints = [];
    const MAX_TRAIL = 30;

    let step = 0;
    const totalSteps = trajectory.length;
    const totalDuration = Weapons.getMissileAnimDuration();
    const intervalMs = totalDuration / totalSteps;

    const interval = setInterval(function() {
      if (step >= totalSteps) {
        clearInterval(interval);
        Renderer.removeMeshFromScene(missileGroup);
        missileGroup.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        // Fade out remaining trail points
        let fadeStep = 0;
        const fadeInterval = setInterval(function() {
          fadeStep++;
          for (const tp of trailPoints) {
            if (tp.mesh.material.opacity > 0) {
              tp.mesh.material.opacity -= 0.05;
              tp.mesh.scale.multiplyScalar(1.05);
            }
          }
          if (fadeStep > 20) {
            clearInterval(fadeInterval);
            for (const tp of trailPoints) {
              Renderer.removeMeshFromScene(tp.mesh);
              tp.mesh.geometry.dispose();
              tp.mesh.material.dispose();
            }
          }
        }, 40);
        return;
      }

      const p = trajectory[step];
      missileGroup.position.set(p.x, p.y, p.z || 0);

      // Orient missile along flight direction
      if (step + 1 < totalSteps) {
        const next = trajectory[step + 1];
        const dir = new THREE.Vector3(next.x - p.x, next.y - p.y, (next.z || 0) - (p.z || 0));
        dir.normalize();
        // Missile's "up" axis is +Y by default; rotate so it points along dir
        const up = new THREE.Vector3(0, 1, 0);
        const quat = new THREE.Quaternion().setFromUnitVectors(up, dir);
        missileGroup.quaternion.copy(quat);
      }

      // Pulse exhaust
      const pulse = 0.8 + Math.sin(step * 0.8) * 0.3;
      exhaust.scale.setScalar(pulse);

      // Spawn smoke trail every 2 steps
      if (step % 2 === 0) {
        const smokeGeo = new THREE.SphereGeometry(1.2 + Math.random() * 0.8, 5, 5);
        const smokeMat = new THREE.MeshBasicMaterial({
          color: step % 4 === 0 ? 0xFFB000 : 0x554400,
          transparent: true,
          opacity: 0.85
        });
        const smoke = new THREE.Mesh(smokeGeo, smokeMat);
        smoke.position.set(p.x, p.y - 1, p.z || 0);
        Renderer.addMeshToScene(smoke);
        trailPoints.push({ mesh: smoke });

        // Cap trail length
        if (trailPoints.length > MAX_TRAIL) {
          const oldest = trailPoints.shift();
          Renderer.removeMeshFromScene(oldest.mesh);
          oldest.mesh.geometry.dispose();
          oldest.mesh.material.dispose();
        }

        // Fade all existing trail smoke
        for (const tp of trailPoints) {
          tp.mesh.material.opacity *= 0.92;
          tp.mesh.scale.multiplyScalar(1.04);
        }
      }

      step++;
    }, intervalMs);
  }

  function animateRobotDelivery(action, trajectory) {
    // Rebuild trajectory using real world positions
    const fromPos = Renderer.segmentToWorldPos(action.hangarSegment);
    const toPos = Renderer.segmentToWorldPos(action.targetSegment);
    trajectory = Robots.createRobotLandingAnim(fromPos, toPos);

    // Delivery capsule mesh
    const capsuleGeo = new THREE.BoxGeometry(4, 8, 4);
    const capsuleMat = new THREE.MeshBasicMaterial({
      color: action.side === CONST.SIDE_PLAYER ? CONST.COLORS.PLAYER : CONST.COLORS.AI_ENEMY
    });
    const capsule = new THREE.Mesh(capsuleGeo, capsuleMat);
    Renderer.addMeshToScene(capsule);

    let step = 0;
    const totalSteps = trajectory.length;
    const intervalMs = 1500 / totalSteps;

    const interval = setInterval(function() {
      if (step >= totalSteps) {
        clearInterval(interval);
        Renderer.removeMeshFromScene(capsule);
        capsule.geometry.dispose();
        capsule.material.dispose();

        // Spawn robot at landing point
        const landPos = Renderer.segmentToWorldPos(action.targetSegment);
        SFX.spawnExplosion(landPos.x, landPos.y + 2, landPos.z, 12);
        SFX.play('robotLand');
        return;
      }
      const p = trajectory[step];
      capsule.position.set(p.x, p.y, p.z || 0);
      capsule.rotation.z += 0.1;
      step++;
    }, intervalMs);
  }

  function endCombatPhase() {
    combatAnimating = false;

    // Clean up robots
    Robots.cleanUpRobots(state);

    // Check win condition
    if (state.winner) {
      state.phase = CONST.PHASE_GAME_OVER;
      if (state.winner === CONST.SIDE_PLAYER) {
        UI.addLogEntry('=== VICTORY! Enemy Command Center destroyed! ===', 'player');
        SFX.play('victory');
      } else {
        UI.addLogEntry('=== DEFEAT! Your Command Center was destroyed! ===', 'enemy');
        SFX.play('defeat');
      }
      UI.showGameOver(state.winner, state);
      return;
    }

    // Log combat summary
    const summary = summarizeCombatLog(state.combatLog);
    if (summary) {
      state.turnLog.push({ turn: state.turn, log: state.combatLog.slice() });
    }

    // Advance turn
    state.turn++;
    UI.addLogEntry('--- Turn ' + state.turn + ' ---', 'system');

    // Next planning phase
    startPlanningPhase();
    SFX.play('turnStart');
  }

  function summarizeCombatLog(log) {
    if (!log || log.length === 0) {
      UI.addLogEntry('No combat actions this turn.', 'system');
      return false;
    }
    return true;
  }

  // ════════════════════════════════════════
  // BUILDING VISUAL UPDATES
  // ════════════════════════════════════════
  function updateBuildingVisual(segmentIndex) {
    const seg = state.segments[segmentIndex];
    if (!seg.building || !seg.building.active) return;

    const mesh = buildingMeshes[segmentIndex];
    if (mesh) {
      const hpPercent = seg.building.hp / seg.building.maxHp;
      Buildings.updateBuildingDamage(mesh, hpPercent);
    }
  }

  function updateAllBuildingVisuals() {
    for (let i = 0; i < TOTAL_SEGMENTS; i++) {
      if (state.segments[i].building && state.segments[i].building.active) {
        updateBuildingVisual(i);
      }
    }
  }

  // ════════════════════════════════════════
  // SEGMENT CLICK HANDLING
  // ════════════════════════════════════════
  function onCanvasClick(event) {
    if (!state || state.phase !== CONST.PHASE_PLANNING) return;
    if (combatAnimating) return;

    // Check UI targeting mode first
    const segIdx = getClickedSegment(event);
    if (segIdx === -1) return;

    // If UI is in targeting mode, handle that
    if (UI.isTargeting()) {
      UI.handleSegmentClick(segIdx);
      return;
    }

    // Building placement
    const selectedType = UI.getSelectedBuildType();
    if (selectedType) {
      attemptBuild(segIdx, selectedType);
    }
  }

  function getClickedSegment(event) {
    if (!raycaster || !Renderer.getCamera()) return -1;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, Renderer.getCamera());
    const intersects = raycaster.intersectObjects(Renderer.segmentMeshes.filter(Boolean));

    if (intersects.length > 0) {
      const hit = intersects[0].object;
      if (hit.userData && hit.userData.segmentIndex !== undefined) {
        return hit.userData.segmentIndex;
      }
    }
    return -1;
  }

  function attemptBuild(segmentIndex, buildingType) {
    const seg = state.segments[segmentIndex];

    // Validate: player side only
    if (seg.side !== CONST.SIDE_PLAYER) {
      UI.addLogEntry('Cannot build on enemy territory!', 'system');
      SFX.play('error');
      return;
    }

    // Validate: not destroyed
    if (seg.destroyed) {
      UI.addLogEntry('Segment is cratered!', 'system');
      SFX.play('error');
      return;
    }

    // Validate: not occupied
    if (seg.building) {
      UI.addLogEntry('Segment already occupied!', 'system');
      SFX.play('error');
      return;
    }

    // Validate: enough energy
    const cost = getCostForBuild(buildingType);
    if (state.playerEnergy < cost) {
      UI.addLogEntry('Not enough energy! Need ' + cost, 'system');
      SFX.play('error');
      return;
    }

    // Build it!
    state.playerEnergy -= cost;
    state.segments[segmentIndex].building = createBuilding(buildingType, CONST.SIDE_PLAYER, segmentIndex);
    placeBuilding(segmentIndex, buildingType, CONST.SIDE_PLAYER);

    SFX.play('build');
    UI.addLogEntry('Built ' + (UI.BUILDING_INFO[buildingType]?.name || buildingType), 'player');
    UI.clearBuildSelection();
    UI.updateHUD(state);
    UI.updateBuildMenu(state);

    // Recalculate income if power plant
    if (buildingType === CONST.BUILDING.POWER_PLANT) {
      state.playerIncome = calculateIncome(state, CONST.SIDE_PLAYER);
      UI.updateHUD(state);
    }
  }

  // ════════════════════════════════════════
  // PLAYER MISSILE / ROBOT TARGETING
  // ════════════════════════════════════════
  function handleMissileTarget(segmentIndex) {
    // Find an available silo
    const silos = getBuildingsOfType(state, CONST.SIDE_PLAYER, CONST.BUILDING.MISSILE_SILO);
    if (silos.length === 0) {
      UI.addLogEntry('No missile silos available!', 'system');
      SFX.play('error');
      return;
    }

    // Use first available silo
    const silo = silos[0];
    const action = Weapons.fireMissile(state, silo.segmentIndex, segmentIndex);
    if (action) {
      pendingPlayerMissiles.push(action);
      UI.addLogEntry('Missile targeted at segment ' + segmentIndex, 'player');
      SFX.play('menuClick');
      // Pan camera toward target
      const targetPos = Renderer.segmentToWorldPos(segmentIndex);
      Renderer.setCameraTarget(targetPos.x, targetPos.z);
    }
  }

  function handleRobotTarget(segmentIndex) {
    const hangars = getBuildingsOfType(state, CONST.SIDE_PLAYER, CONST.BUILDING.ROBOT_HANGAR);
    const available = hangars.filter(h => !h.deployedThisTurn);
    if (available.length === 0) {
      UI.addLogEntry('No hangars available!', 'system');
      SFX.play('error');
      return;
    }

    const hangar = available[0];
    const action = Robots.deployRobot(state, hangar.segmentIndex, segmentIndex);
    if (action) {
      pendingPlayerRobots.push(action);
      UI.addLogEntry('Robot targeted at segment ' + segmentIndex, 'player');
      SFX.play('menuClick');
    }
    UI.updateBuildMenu(state);
  }

  function handleEndTurn() {
    if (state.phase !== CONST.PHASE_PLANNING) return;
    UI.addLogEntry('Turn ended. AI is planning...', 'system');
    startAIPlanningPhase();
  }

  // ════════════════════════════════════════
  // GAME LOOP
  // ════════════════════════════════════════
  let lastFrameTime = 0;

  function gameLoop(time) {
    requestAnimationFrame(gameLoop);
    const dt = Math.min((time - lastFrameTime) / 1000, 0.05);
    lastFrameTime = time;

    if (!state) return;

    // Update effects
    SFX.update(dt, Renderer.getCamera());

    // Animate buildings (radar dish rotation, etc)
    Buildings.animateBuildings(dt);

    // Update effect groups
    for (let i = effectGroups.length - 1; i >= 0; i--) {
      const group = effectGroups[i];
      if (group.userData && group.userData.update) {
        const alive = group.userData.update(dt * 1000);
        if (!alive) {
          Renderer.removeMeshFromScene(group);
          effectGroups.splice(i, 1);
        }
      }
    }
  }

  // ════════════════════════════════════════
  // UI CALLBACKS & EVENT BINDING
  // ════════════════════════════════════════
  function boot() {
    // Initialize UI with callbacks
    UI.init({
      onBuildSelect: function(type) {
        // Just sets selection in UI, actual placement on segment click
      },
      onEndTurn: handleEndTurn,
      onMissileTarget: handleMissileTarget,
      onRobotTarget: handleRobotTarget,
      onStartGame: function(aiMode) {
        SFX.play('menuClick');
        initGame(aiMode);
      }
    });

    // Canvas click handler (needs to wait for renderer)
    document.addEventListener('click', function(e) {
      // Don't handle clicks on UI elements
      if (e.target.closest('#ui-container')) return;
      onCanvasClick(e);
    });

    // Show main menu
    UI.showMainMenu();

    console.log('[Orchestrator] Robot Strategy Attack 2026 booted.');
  }

  // ── Start on DOM ready ──
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();
</script>

</body>
</html>
