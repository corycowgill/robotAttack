<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Attack 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #0b0e13; }
  #game-canvas { position: fixed; inset: 0; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px); }
  #boot-error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #ffb1a8; font: 18px system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="boot-error">Robot Attack needs WebGL and an internet connection to load Three.js.<br>Please use a modern browser.</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if (!window.THREE) document.getElementById('boot-error').style.display = 'flex';</script>

<!-- Game modules: data → rules → AI → presentation → orchestrator -->
<script src="config.js"></script>
<script src="rules.js"></script>
<script src="ai.js"></script>
<script src="audio.js"></script>
<script src="models.js"></script>
<script src="fx.js"></script>
<script src="renderer.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
