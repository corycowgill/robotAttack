name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium build for newer Ubuntu
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rules and AI simulation tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e

  # Publish the game to GitHub Pages once the tests pass on main
  deploy:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest *.js _site/
          cp -r vendor assets _site/
      # Pages must be enabled once by hand: Settings > Pages > Source > GitHub Actions
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
