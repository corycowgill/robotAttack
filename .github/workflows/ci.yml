name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium build for newer Ubuntu
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rules and AI simulation tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
